<nav class="navbar">

  <div class="navbar-container">

    <!-- Brand -->
    <a
      routerLink="/home"
      class="brand"
      (click)="closeMenu()"
    >
      <span class="brand-icon">&lt;/&gt;</span>

      <span class="brand-name">
        <span>Tech</span>
        <strong>Glossary</strong>
      </span>
    </a>

    <!-- Desktop Navigation -->
    <div class="nav-links">

      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a
        routerLink="/categories"
        routerLinkActive="active"
      >
        Categories
      </a>

      <a
        routerLink="/glossary"
        routerLinkActive="active"
      >
        Glossary
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
      >
        About
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
      >
        Contact
      </a>

    </div>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Mobile Navigation -->
  <div
    class="mobile-menu"
    [class.open]="isMenuOpen"
  >

    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      Home
    </a>

    <a
      routerLink="/categories"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Categories
    </a>

    <a
      routerLink="/glossary"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Glossary
    </a>

    <a
      routerLink="/about"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      About
    </a>

    <a
      routerLink="/contact"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Contact
    </a>

  </div>

</nav>
